# Workhorse Layer 1 defaults (embedded for standalone binaries).
# CDRL: keep this file in sync with config/{config_name}/v1.0.0/{config_name}-defaults.yaml
server:
  host: 127.0.0.1
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 10s
logging:
  level: info
  profile: STRUCTURED
metrics:
  enabled: true
  port: 8080
health:
  enabled: true
debug:
  enabled: false
workers: 4
enable_ui: false
