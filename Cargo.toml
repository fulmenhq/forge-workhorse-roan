[package]
name = "roan"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A Fulmen workhorse application template for robust, scalable Rust backends and CLI tools"
repository = "https://github.com/fulmenhq/forge-workhorse-roan"
homepage = "https://github.com/fulmenhq/forge-workhorse-roan"
readme = "README.md"
authors = ["FulmenHQ <fulmenhq@3leaps.net>"]
keywords = ["fulmen", "workhorse", "template"]
categories = ["command-line-utilities", "web-programming"]
publish = false

[lib]
name = "app"
path = "internal/lib.rs"

[[bin]]
name = "roan"
path = "cmd/roan/main.rs"

[features]
default = []
# Optional 3 Leaps primitive crates are documented only. They are not
# crate dependencies and are not required for bootstrap or run.

[dependencies]
rsfulmen = "=0.1.5"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
axum = { version = "0.8", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "1.0"
once_cell = "1.19"
http = "1.3"
jsonschema = { version = "0.17", default-features = false }
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
